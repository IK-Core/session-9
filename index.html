function input(label){return `<label class="prompt" for="answer">${label}</label><div class="money-input"><span aria-hidden="true">$</span><input id="answer" data-field="answer" class="numeric" inputmode="decimal" autocomplete="off" aria-label="${label}, dollars" value="${esc(data().answer||'')}" placeholder="Enter amount"></div>`;}
function record(r,index,total,kicker='Transaction record'){return `<div class="mini-progress"><span>${kicker}</span><span>Record ${index+1} of ${total}</span></div><div class="record"><div class="record-kicker">April 2026 · ${state.stage>=9?'SPARK':'NOVA'}</div><div class="record-title">${r[0]}</div><div class="record-amount">${money(r[1])}</div><div class="record-note">${r[2]}</div></div>`;}
function classify(records){const d=data(),i=d.index||0,r=records[i];if(i>=records.length)return '';return record(r,i,records.length)+`<div class="category-grid">${cats.map((c,j)=>`<button data-cat="${j}" ${d.accepted?'disabled':''} class="${d.choice===j?'selected':''}" aria-pressed="${d.choice===j}">${c}</button>`).join('')}</div>`;}
function reviewChecks(){const qs=['I used the financial results.','My recommendation is realistic.','I did not invent information.','I can explain why it may help.'];return `<div class="checks">${qs.map((q,i)=>`<label><input type="checkbox" data-field="check${i}" ${data()['check'+i]?'checked':''}>${q}</label>`).join('')}</div>`;}
function recommendation(company,vals){return heading('Management desk',company+' needs your advice','Choose one area that deserves attention. Write one realistic recommendation and explain why.')+`<div class="surface">${mini(vals[0],vals[1],vals[3])}<p class="note center">Operating profit: <strong>${money(vals[4])}</strong></p><label class="prompt" for="writing">Your recommendation and reason</label><textarea id="writing" data-field="writing" placeholder="I recommend… because…">${esc(data().writing||'')}</textarea>${reviewChecks()}<p class="note">Your reasoning is for self-review and instructor discussion. It is not automatically graded.</p></div>`;}

if(s===0)return heading('Part A · Learn by building','How much did NOVA actually earn?','April is finished at NOVA Print Lab. You will turn its printing records into a clear financial report.')+`<div class="surface">${statement([null,null,null,null,null])}<div class="roadmap"><b>Sales</b><i>→</i><span>Costs</span><i>→</i><span>Expenses</span><i>→</i><span>Report</span><i>→</i><span>Decision</span></div><p class="note center">Posters · Brochures · Business cards · Event materials</p></div>`;
if(s===1)return heading('01 · Revenue earned','A sale is more than a payment.','NOVA completed a printing job. The customer paid part of the invoice and will pay the rest later.')+`<div class="surface"><div class="document">${docHead('NOVA PRINT LAB','Invoice N-401 · completed job')}<div class="statement-row"><span>Printed event materials · delivered in April</span><span class="amount">$4,800</span></div><div class="metrics"><div class="metric"><small>Cash received</small><strong>$4,000</strong></div><div class="metric"><small>Still owed by customer</small><strong>$800</strong></div></div></div>${input('How much revenue did NOVA earn?')}${d.passed?mini(4800):''}</div>`;
if(s===2)return heading('02 · Complete the sales picture','Three jobs. One revenue total.','All three jobs were completed in April. Add the value NOVA earned from its customers.')+`<div class="surface"><div class="document">${docHead('NOVA PRINT LAB','Completed jobs register')}<div class="statement-row"><span>Job A <small>· $4,000 received; $800 owed</small></span><span class="amount">$4,800</span></div><div class="statement-row"><span>Job B <small>· paid in full</small></span><span class="amount">$2,800</span></div><div class="statement-row"><span>Job C <small>· not paid yet</small></span><span class="amount">$1,400</span></div></div>${input('What is total April revenue?')}${d.passed?mini(9000):''}</div>`;

if(s===4)return heading('04 · Running the business','Some costs support the whole business.','Select a category for each April expense. Then calculate the total operating expenses.')+`<div class="surface">${(d.index||0)<4?classify(operating):`<div class="document">${docHead('NOVA PRINT LAB','Operating expense register')}${operating.map(r=>`<div class="statement-row"><span>${r[0]}</span><span class="amount">${money(r[1])}</span></div>`).join('')}</div>${input('What are total operating expenses?')}${d.passed?mini(9000,3500,3830):''}`}</div>`;
if(s===5)return heading('05 · The accounting traps','Does this belong in April profit?','Review each record. Decide how it affects April’s income statement; do not count a record twice.')+`<div class="surface">${classify(traps)}</div>`;
if(s===6)return heading('06 · Build the financial report','Make the numbers tell the story.','Enter the five missing values, using the records you reviewed.')+`<div class="surface">${statement([],'NOVA PRINT LAB',true)}${!d.passed?'<p class="note">Gross profit = revenue − direct costs. Operating profit = gross profit − operating expenses.</p>':''}</div>`;
if(s===7)return heading('07 · Profit and cash','Is profit the bank balance?','NOVA earned $1,670 operating profit. Does this mean it has exactly $1,670 in its bank account?')+`<div class="surface"><div class="record center"><div class="record-kicker">April operating profit</div><div class="record-amount">$1,670</div><div class="record-note">A performance measure for April</div></div><div class="options">${['Yes','No'].map(x=>`<button data-bank="${x}" aria-pressed="${d.bank===x}">${x}</button>`).join('')}</div><label class="prompt" for="writing">Explain your choice in your own words</label><textarea id="writing" data-field="writing" placeholder="Profit and cash can differ because…">${esc(d.writing||'')}</textarea><p class="note">Your explanation is saved for discussion; the game checks your choice, not the quality of your writing.</p></div>`;
if(s===8)return recommendation('NOVA',novaValues);

}

function updateStorageLabel(){$('#saved').textContent=storageWorks?(DEMO?'Instructor copy · saved on this device':'SPARK saved on this device'):'Saving unavailable · export before closing';$('#saved').classList.toggle('storage-warning',!storageWorks);}
try{const raw=localStorage.getItem(KEY);if(raw){attempt=validateImport(JSON.parse(raw));if(attempt.status==='draft'){screen='task';}else screen='results';}}catch(e){storageWorks=false;notice='Saved SPARK data could not be opened. Import a saved assessment file or start a new attempt.';}
function head(title,desc){return heading('SPARK Events · Assessment mode',title,desc);}
function foot(primary,back=true,status=''){ $('#action').textContent=primary;$('#action').disabled=false;$('#back').disabled=!back;$('#hint').hidden=true;$('#footer-status').textContent=status; }
function documentMoney(v){return v===null?'Amount to calculate':v<0?'−'+money(-v):money(v);}
function sourceDocument(i){const r=records[i];if(!r)return `<div class="record"><div class="record-kicker">Internal accounting note ${i-records.length+1}</div><div class="record-title">${esc(problems[i-records.length][1])}</div><div class="record-note">Unverified internal working note · review against the original documents.</div></div>`;return `<div class="record"><div class="record-kicker">${esc(r[7])} · April 2026</div><div class="record-title">${esc(r[1])}</div><div class="record-amount">${documentMoney(r[2])}</div><div class="record-note">${esc(r[3])}</div></div>`;}
function sourceRecords(){return `<details class="assessment-sources"><summary>Open the financial documents</summary><label class="assessment-label" for="source-document">Select a source document</label><select id="source-document">${[...records.map(r=>r[1]),...problems.map((p,i)=>'Internal note '+(i+1))].map((n,i)=>`<option value="${i}" ${sourceIndex===i?'selected':''}>${esc(n)}</option>`).join('')}</select><div id="source-document-view">${sourceDocument(sourceIndex)}</div><p class="note">Every record and internal note is available from the start. Amounts are USD. The projector policy gives a 36-month life, zero residual value, and an April start.</p></details>`;}
function libraryContent(){const docs=[...records.map(r=>({title:r[1],type:r[7]})),...problems.map((p,i)=>({title:'Internal note '+(i+1),type:'Accounting working note'}))],start=libraryPage*6;return head('Open SPARK’s financial records.','SPARK plans corporate events, retreats, workshops and conferences. Inspect a document, classify it, then return to the case file.')+`<div class="surface"><div class="assessment-counter">Case file · April 2026<span>${Object.keys(attempt.answers.classifications).length} / ${records.length} records have an answer</span></div><div class="document-grid">${docs.slice(start,start+6).map((d,j)=>`<button data-open-document="${start+j}"><span class="doc-type">${esc(d.type)}</span><b>${esc(d.title)}</b><span>${start+j<records.length?(Number.isInteger(attempt.answers.classifications[records[start+j][0]])?'Answer saved':'Open document'):'Read note'}</span></button>`).join('')}</div><div class="assessment-tools"><button data-assess-action="library-prev" ${libraryPage===0?'disabled':''}>← Previous documents</button><span>Page ${libraryPage+1} of ${Math.ceil(docs.length/6)}</span><button data-assess-action="library-next" ${start+6>=docs.length?'disabled':''}>Next documents →</button></div><button class="quiet" data-assess-action="next-section">Continue to accounting problems →</button></div>`;}
function field(id,label,value,attrs=''){return `<label class="assessment-label" for="${id}">${label}</label><input id="${id}" value="${esc(value??'')}" ${attrs}>`;}
function choiceButtons(value,kind,labels=['Problem','No problem']){return `<div class="options">${[true,false].map((v,i)=>`<button data-assess-choice="${v}" data-kind="${kind}" aria-pressed="${value===v}">${labels[i]}</button>`).join('')}</div>`;}
function recordGroups(answers){return [...categories.map((label,id)=>({id,label,records:records.filter(r=>answers.classifications[r[0]]===id)})),{id:categories.length,label:'Not classified yet',records:records.filter(r=>!Number.isInteger(answers.classifications[r[0]]))}];}
function workspace(){return attempt.workspace||(attempt.workspace={mode:'groups',group:attempt.page.index===1?3:0});}
function worksheetTabs(){const w=workspace();return `<div class="worksheet-tabs" aria-label="Income statement workspace"><button data-worksheet-view="groups" aria-pressed="${w.mode==='groups'}">My grouped records</button><button data-worksheet-view="statement" aria-pressed="${w.mode==='statement'}">Income statement</button></div>`;}
function groupedRecords(){const w=workspace(),groups=recordGroups(attempt.answers),group=groups[w.group],fieldKey=['revenue','direct','operating','finance','tax'][group.id],f=statementFields.find(x=>x[0]===fieldKey);return `<div class="document grouped-document"><div class="group-category-heading"><label for="group-category">My record groups</label><select id="group-category">${groups.map(g=>`<option value="${g.id}" ${g.id===group.id?'selected':''}>${g.label} (${g.records.length})</option>`).join('')}</select></div><div class="grouped-list" tabindex="0" aria-label="${esc(group.label)} selected records">${group.records.length?group.records.map(r=>`<div class="grouped-record" data-grouped-record="${r[0]}"><div><span>${esc(r[1])}</span><b>${documentMoney(r[2])}</b></div>${r[2]===null?`<p>${esc(r[3])}</p>`:''}</div>`).join(''):'<p class="empty-group">You have not selected any records for this group.</p>'}</div>${f?`<div class="group-total"><label for="assessment-group-amount">My calculated ${f[1].toLowerCase()}</label><input id="assessment-group-amount" data-assess-amount="${f[0]}" class="numeric" inputmode="decimal" aria-label="${f[1]}, dollars" value="${esc(attempt.answers.statement[f[0]]||'')}" placeholder="$ —"></div>`:''}<p class="note">Groups follow your choices. Calculate totals yourself; they have not been checked.</p></div>`;}
function taskContent(){const {section:s,index:i}=attempt.page,a=attempt.answers;
 const prefix=`<div class="assessment-counter">Section ${s+1} of 4 · ${sectionNames[s]}<span>${s===2?'Page':'Item'} ${i+1} of ${counts[s]}</span></div>`;
 if(s===0){const r=records[i];return head('Investigate the financial records.','Choose how this document affects the report. No answer will be checked before final submission.')+`<div class="surface">${prefix}${sourceDocument(i)}<label class="assessment-label" for="classification">Your classification</label><select id="classification" data-assess-field="classification"><option value="">Choose a category</option>${categories.map((c,j)=>`<option value="${j}" ${a.classifications[r[0]]===j?'selected':''}>${c}</option>`).join('')}</select><button class="quiet" data-assess-action="library">Back to all documents</button></div>`;}
 if(s===1){const p=problems[i],v=a.problems[p[0]]||{};return head('Detect accounting problems.','Read the internal note. Choose Problem or No problem and justify your decision.')+`<div class="surface">${prefix}<div class="record"><div class="record-kicker">Internal accounting note</div><div class="record-title">${esc(p[1])}</div></div>${choiceButtons(v.choice,'problem')}<label class="assessment-label" for="assessment-reason">Justify your decision</label><textarea id="assessment-reason" data-assess-field="problemReason" maxlength="4000" placeholder="I chose this because…">${esc(v.explanation||'')}</textarea>${sourceRecords()}</div>`;}
 if(s===2){const fs=i===0?statementFields.slice(0,5):statementFields.slice(5);return head('Build the income statement.','Review the records grouped by your choices, calculate your totals and enter them in the report.')+`<div class="surface">${prefix}${worksheetTabs()}${workspace().mode==='groups'?groupedRecords():`<div class="document assessment-statement">${docHead('SPARK EVENTS',i===0?'Income statement · operating result':'Income statement · final result')}${fs.map(f=>`<div class="statement-row ${['operatingProfit','net'].includes(f[0])?'profit':''}"><label for="assessment-${f[0]}">${f[1]}</label><input id="assessment-${f[0]}" class="numeric" data-assess-amount="${f[0]}" inputmode="decimal" aria-label="${f[1]}, dollars" value="${esc(a.statement[f[0]]||'')}" placeholder="$ —"></div>`).join('')}</div>`}${sourceRecords()}</div>`;}
 return head('Does profit mean there are no financial problems?','Write a short answer for management. Use your proposed report and source records to recommend a practical action.')+`<div class="surface">${prefix}<label class="assessment-label" for="recommendation">Your recommendation and financial evidence</label><textarea id="recommendation" data-assess-field="recommendation" maxlength="4000" placeholder="I recommend… My financial evidence is… This may help because…" style="min-height:105px">${esc(a.recommendation)}</textarea><div class="checks">${['I used financial evidence.','I identified a realistic concern.','My action is practical.','I did not invent information.'].map((q,i)=>`<label><input type="checkbox" data-assess-check="${i}" ${a.selfReview?.[i]?'checked':''}>${q}</label>`).join('')}</div><p class="note">Pending instructor review. Consider unpaid invoices, unpaid expenses, cash needs and event costs. Self-review is not an automatic grade.</p><details class="assessment-sources"><summary>View my proposed report</summary>${statementFields.map(f=>`<div class="statement-row"><span>${f[1]}</span><b>${esc(a.statement[f[0]]||'Unanswered')}</b></div>`).join('')}</details>${sourceRecords()}</div>`;
}
function readyContent(){const missing=unanswered(),done=missing.filter(x=>!x.length).length;return head('Assessment Ready to Submit','Review your saved answers. You can revise them until you confirm final submission.')+`<div class="surface"><div class="assessment-identity"><b>${esc(attempt.studentName)}</b><span>${esc(attempt.attemptId)} · revision ${attempt.revision}</span></div><div class="document">${sectionNames.map((n,i)=>`<div class="statement-row"><span>${i+1}. ${n}</span><b>${missing[i].length?missing[i].length+' unanswered':'Completed'}</b></div>`).join('')}</div><p class="note">Sections completed: ${done} / 4. ${missing.some(x=>x.length)?'Use Review answers to complete the missing items.':'All questions have an answer. No answers have been graded yet.'}</p><div class="assessment-tools"><label for="review-section">Review answers</label><select id="review-section">${sectionNames.map((n,i)=>`<option value="${i}">${i+1}. ${n}</option>`).join('')}</select><button data-assess-action="review-section">Open section</button></div>${missing.some(x=>x.length)?`<details class="assessment-sources"><summary>View unanswered questions</summary><div class="source-list">${missing.flatMap((xs,i)=>xs.map(x=>`<div><b>Section ${i+1}</b><span>${esc(x)}</span></div>`)).join('')}</div></details>`:''}<button class="quiet" data-assess-action="export">Export draft JSON</button></div>`;}
function resultProfile(){const g=attempt.submission.automatic;return {names:g.sectionNames,max:g.sectionMax};}
function mistakeRows(){return attempt?.submission?attempt.submission.automatic.rows.flatMap((rows,section)=>rows.filter(r=>r.points<r.max).map(r=>({...r,section,sectionName:resultProfile().names[section]}))):[];}
function summaryRows(){const g=attempt.submission.automatic,p=resultProfile();return `<div class="document assessment-result">${p.names.map((n,i)=>`<div class="statement-row"><span>${n}</span><b>${i<g.scores.length?g.scores[i]+' / '+p.max[i]:attempt.review?attempt.review.total+' / 10':'Pending instructor review'}</b></div>`).join('')}<div class="statement-row total"><span>Automatic score</span><b>${g.automatic} / 90</b></div><div class="statement-row"><span>Instructor assessment</span><b>${attempt.review?attempt.review.total+' / 10':'Pending / 10'}</b></div><div class="statement-row profit"><span>${attempt.review?'FINAL GRADE':'Final score'}</span><b>${attempt.review?(g.automatic+attempt.review.total)+' / 100 · '+(g.automatic+attempt.review.total)+'%':'Pending / 100'}</b></div></div>`;}
function mistakesContent(){const rows=mistakeRows();return head('Incorrect answers','SPARK Events · April 2026')+(rows.length?`<div class="surface"><ol class="incorrect-answers">${rows.map(r=>`<li><h2>${esc(r.question)}</h2><dl class="answer-review"><dt>Your answer</dt><dd>${esc(r.original)}</dd><dt>Correct answer</dt><dd>${esc(r.correct)}</dd></dl></li>`).join('')}</ol></div>`:'<div class="surface"><p class="no-mistakes" role="status">No incorrect answers.</p></div>');}
function resultsContent(){if(!DEMO)return mistakesContent();return head('Financial Investigation Results','SPARK Events · April 2026 · submitted answers are locked.')+`<div class="surface"><div class="assessment-identity"><b>Student: ${esc(attempt.studentName)}</b><span>${esc(attempt.attemptId)} · revision ${attempt.revision}</span></div>${summaryRows()}<div class="assessment-tools"><button data-assess-action="export">Export JSON</button><button data-assess-action="all-feedback">Review all answers</button><button data-assess-action="report">Download report</button><button data-assess-action="print">Print / Save PDF</button>${!DEMO?'<button data-assess-action="import">Import instructor return</button>':'<button data-assess-action="grade">Grade recommendation</button>'}</div>${attempt.review?`<p class="note">Instructor feedback: ${esc(attempt.review.feedback||'No written feedback added.')}</p>`:'<p class="note">Export your submission and give the file to your instructor. Their reviewed JSON file adds the final grade on import.</p>'}</div>`;}
function feedbackRows(section){if(section===resultProfile().names.length-1)return [{question:'Management recommendation',original:attempt.submission.answers.recommendation,correct:'Instructor-reviewed rubric',explanation:attempt.review?attempt.review.feedback||'No written feedback added.':'Pending instructor review. Evidence: 4 points; realistic concern: 3; practical recommendation: 3.',points:attempt.review?.total,max:10}];return attempt.submission.automatic.rows[section];}
function detailContent(){const rs=feedbackRows(detailSection),r=rs[detailIndex];return head('Review the submitted work.','Your original answers are read-only. Feedback is available because this attempt has been submitted.')+`<div class="surface"><div class="assessment-tools"><label for="detail-section">Section</label><select id="detail-section">${resultProfile().names.map((n,i)=>`<option value="${i}" ${i===detailSection?'selected':''}>${n}</option>`).join('')}</select></div><div class="assessment-counter">Item ${detailIndex+1} of ${rs.length}<span>${r.points===undefined?'Pending instructor review':r.points+' / '+r.max+' points'}</span></div><div class="record"><div class="record-title">${esc(r.question)}</div></div><dl class="answer-review"><dt>Your original answer</dt><dd>${esc(r.original)}</dd><dt>${detailSection===resultProfile().names.length-1?'Review basis':'Correct answer'}</dt><dd>${esc(r.correct)}</dd><dt>Explanation</dt><dd>${esc(r.explanation)}</dd>${r.written?`<dt>Your written explanation</dt><dd>${esc(r.written)}</dd>`:''}</dl><div class="assessment-tools"><button data-assess-action="detail-prev" ${detailIndex===0?'disabled':''}>← Previous item</button><button data-assess-action="detail-next" ${detailIndex===rs.length-1?'disabled':''}>Next item →</button><button data-assess-action="skills">Performance summary</button></div></div>`;}
function skillRows(){const rows=attempt.submission.automatic.rows,subset=ids=>{const list=rows[0].filter(r=>ids.includes(r.id));return `${list.filter(r=>r.points===r.max).length} / ${list.length} records identified`;};return [
 ['Identifying revenue',subset(['eventA','eventB','eventC','credit'])],['Direct and operating costs',subset(['cateringA','venueA','transport','cateringB','materialsC','freelancer','rent','admin','utilities','advertising','depreciation'])],['Reporting periods',subset(['deposit','march','insurance'])],['Duplicate transactions',subset(['duplicate'])],['Preparing an income statement',`${rows[2].filter(r=>r.points===r.max).length} / 9 fields accurate`],['Management recommendation',attempt.review?`Instructor rubric: evidence ${attempt.review.evidence}/4; concern ${attempt.review.concern}/3; action ${attempt.review.practical}/3`:'Pending instructor review']
 ];}
function skillsContent(){return head('Demonstrated skills','These indicators come from this submitted attempt. They are a breakdown of results, not a separate grade.')+`<div class="surface document">${skillRows().map(([n,v])=>`<div class="statement-row"><span>${n}</span><b>${esc(v)}</b></div>`).join('')}</div>`;}
function gradeContent(){return head('Review the management recommendation.','Score the three rubric criteria. The final grade is issued only after you save all three scores.')+`<div class="surface"><div class="assessment-identity"><b>${esc(attempt.studentName)}</b><span>${esc(attempt.attemptId)} · revision ${attempt.revision}</span></div><blockquote class="submitted-writing">${esc(attempt.submission.answers.recommendation)}</blockquote><div class="rubric-grid">${[['evidence','Uses financial evidence',4],['concern','Realistic business concern',3],['practical','Practical recommendation',3]].map(([k,n,m])=>`<label>${n} / ${m}<input type="number" min="0" max="${m}" step="1" data-rubric="${k}" value="${esc(gradeDraft[k])}" aria-label="${n}, out of ${m}"></label>`).join('')}</div><label class="assessment-label" for="instructor-feedback">Instructor feedback</label><textarea id="instructor-feedback" data-rubric="feedback" maxlength="4000">${esc(gradeDraft.feedback)}</textarea><p class="note">Export the reviewed submission JSON and return it to the student. This does not update another device automatically.</p></div>`;}
function introContent(){return head('Your independent SPARK assessment.','Four sections. Save your answers, review your work, then submit. After submission, you will see which responses need attention.')+`<div class="surface"><div class="record"><div class="record-kicker">SPARK Events · April 2026</div><div class="record-title">Investigate. Prepare. Recommend.</div><div class="record-note">Classify the records, examine accounting claims, build the report, and make a recommendation.</div></div>${field('student-name','Student name',attempt?.studentName||'','maxlength="120" autocomplete="name"')}<p class="note">No hints or corrections are provided during the assessment. Save & Continue also lets you leave an item blank; unanswered items must be completed before submission.</p><button class="quiet" data-assess-action="import">Import assessment JSON</button></div>`;}
function renderAssessment(focus=false){
 if(state.stage<9)return;$('#card').dataset.stage='assessment';$('#card').className='card assessment-card';$('#reset').hidden=true;$('#hint').hidden=true;$('#concepts').hidden=true;$('#part-label').textContent='Phase 3 / Apply · SPARK assessment';$('#case-label').textContent='SPARK EVENTS · APRIL 2026';
 $('#action').hidden=false;$('#back').hidden=false;$('#footer-status').hidden=false;let body='';if(!attempt)screen='intro';if(!DEMO&&attempt?.status==='submitted')screen='results';if(attempt?.status==='submitted'&&['intro','task','ready','records','document'].includes(screen))screen='results';
 if(screen==='intro'){body=introContent();foot(attempt?'Resume assessment →':'Start assessment →',true,'Independent work');}
 if(screen==='records'){body=libraryContent();foot(Object.keys(attempt.answers.classifications).length<records.length?'Open next record →':'Continue to accounting problems →',true,'All source documents are available');}
 if(screen==='document'){body=head('Read the accounting note.','This is an unverified internal working note. You will review these claims in the accounting-problems section.')+`<div class="surface">${sourceDocument(sourceIndex)}</div>`;foot('Back to all documents',true,'Source document');}
 if(screen==='task'){body=taskContent();const grouped=attempt.page.section===2&&workspace().mode==='groups';foot(grouped?'Save & open statement →':'Save & Continue →',true,grouped?`Report page ${attempt.page.index+1} of 2 · your saved selections`:reviewMode?'Reviewing saved answers':'Answers can be revised before submission');}
 if(screen==='ready'){body=readyContent();foot('Submit Assessment',true,'Review → confirm → submit');$('#action').disabled=unanswered().some(x=>x.length);}
 if(screen==='results'){body=resultsContent();foot('Review detailed feedback',false,'Submitted · read-only');}
 
 if(screen==='details'){body=detailContent();foot('Back to results',false,'Submitted · read-only');}
 if(screen==='skills'){body=skillsContent();foot('Back to results',false,'Indicators use submitted answers');}
 if(screen==='grade'){body=gradeContent();foot('Save instructor assessment',false,'Instructor review');}
 if(screen==='task'&&reviewMode)body+='<button class="quiet return-review" data-assess-action="return-review">Return to submission review</button>';
 $('#card').classList.toggle('group-workspace',screen==='task'&&attempt.page.section===2&&workspace().mode==='groups');$('#card').classList.toggle('review-workspace',screen==='task'&&reviewMode);
 $('#card').innerHTML=body+`<div id="assessment-status" class="assessment-status" role="status">${esc(flash)}</div>${notice?`<p class="assessment-notice" role="alert">${esc(notice)}</p>`:''}`;
 $('#assessment-export-header').hidden=!attempt;$('#assessment-import-header').hidden=!attempt||DEMO;if(!DEMO&&attempt?.status==='submitted'){$('#action').hidden=true;$('#back').hidden=true;$('#footer-status').hidden=true;}
 $('#stage-label').textContent=screen==='task'?`Section ${attempt.page.section+1} of 4`:screen==='intro'?'Independent assessment':screen==='records'?'Financial investigation':screen==='document'?'Source document':screen==='ready'?'Review and submit':screen==='grade'?'Instructor review':'Submitted';
 const complete=attempt?4-unanswered().filter(x=>x.length).length:0;$('#progress').style.width=((13+complete)/17*100)+'%';$('.track').setAttribute('aria-valuenow',13+complete);updateStorageLabel();saveGuideLocation();if(DEMO)parent.postMessage({scope:'recode-instructor-state',hasAttempt:!!attempt,status:attempt?.status||'none'},'*');if(focus)$('#card').focus({preventScroll:true});
}
function saveGuideLocation(){if(!DEMO)try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function takeInput(e){if(state.stage<9||!attempt||attempt.status!=='draft')return;const t=e.target,a=attempt.answers,{section:s,index:i}=attempt.page;
 if(t.dataset.assessField==='classification'){if(t.value==='')delete a.classifications[records[i][0]];else a.classifications[records[i][0]]=Number(t.value);}
 if(t.dataset.assessField==='problemReason'){const k=problems[i][0];(a.problems[k]??={}).explanation=t.value;}
 if(t.dataset.assessField==='recommendation')a.recommendation=t.value;
 if(t.dataset.assessAmount)a.statement[t.dataset.assessAmount]=t.value;
 if(t.hasAttribute('data-assess-check')){a.selfReview??=[false,false,false,false];a.selfReview[Number(t.dataset.assessCheck)]=t.checked;}
 flash='';if($('#assessment-status'))$('#assessment-status').textContent='';persist();
}
function primary(){notice='';
 if(screen==='intro'){const name=$('#student-name').value.trim();if(!name){notice='Enter your name before starting.';renderAssessment();$('#student-name').focus();return;}if(!attempt)attempt=newAttempt(name);else attempt.studentName=name;screen='records';persist();renderAssessment(true);return;}
 if(screen==='document'){screen='records';renderAssessment(true);return;}
 if(screen==='records'){const i=records.findIndex(r=>!Number.isInteger(attempt.answers.classifications[r[0]]));if(i<0){attempt.page={section:1,index:0};screen='task';}else{attempt.page={section:0,index:i};screen='task';}persist();renderAssessment(true);return;}
 if(screen==='task'){
  persist();flash='Answer saved.';const p=attempt.page;
  if(p.section===2&&workspace().mode==='groups'){workspace().mode='statement';persist();renderAssessment(true);return;}
  if(p.section===0&&!reviewMode){screen='records';}else if(p.index+1<counts[p.section]){p.index++;if(p.section===2){workspace().mode='groups';workspace().group=3;}}else if(p.section<3){p.section++;p.index=0;if(p.section===2)attempt.workspace={mode:'groups',group:0};}else{screen='ready';reviewMode=false;}persist();renderAssessment(true);return;
 }
 if(screen==='ready'){if(unanswered().some(x=>x.length))return;confirmAction('Submit this assessment?','Your saved answers will be locked and graded. You will need your instructor to unlock or reset the attempt.','Submit Assessment',submit);return;}
 if(screen==='results'){if(!DEMO)return;screen='details';mistakeIndex=0;detailSection=0;detailIndex=0;flash='';renderAssessment(true);return;}
 if(screen==='mistakes'){if(mistakeIndex<mistakeRows().length-1)mistakeIndex++;else screen='results';renderAssessment(true);return;}
 if(screen==='details'||screen==='skills'){screen='results';flash='';renderAssessment(true);return;}
 if(screen==='grade')saveReview();
}
function back(){flash='';notice='';if(screen==='mistakes'){if(mistakeIndex>0)mistakeIndex--;renderAssessment(true);return;}if(screen==='intro'){state.stage=8;$('#card').className='card';$('#reset').hidden=false;render(true);return;}
 if(screen==='document'){screen='records';renderAssessment(true);return;}
 if(screen==='records'){screen='intro';renderAssessment(true);return;}
 if(screen==='ready'){attempt.page={section:3,index:0};screen='task';reviewMode=false;renderAssessment(true);return;}
 if(screen==='task'&&attempt.status==='draft'){reviewMode=false;const p=attempt.page;if(p.index>0)p.index--;else if(p.section>0){p.section--;p.index=counts[p.section]-1;}else {screen='intro';}if(p.section===2)workspace().mode='statement';persist();renderAssessment(true);}
}
function submit(){if(!attempt||attempt.status!=='draft'||unanswered().some(x=>x.length))return;attempt.problemRubric=PROBLEM_RUBRIC;attempt.assessmentRubric=ASSESSMENT_RUBRIC;attempt.submission={revision:attempt.revision,problemRubric:PROBLEM_RUBRIC,assessmentRubric:ASSESSMENT_RUBRIC,submittedAt:now(),answers:clone(attempt.answers),automatic:grade(attempt.answers,PROBLEM_RUBRIC,ASSESSMENT_RUBRIC)};attempt.status='submitted';attempt.review=null;mistakeIndex=0;screen='results';flash='';persist();archive();renderAssessment(true);}
function saveReview(){if(!DEMO||attempt?.status!=='submitted')return;const r={feedback:gradeDraft.feedback,reviewedAt:now()};for(const k of ['evidence','concern','practical'])r[k]=gradeDraft[k]===''?NaN:Number(gradeDraft[k]);if(!validRubric(r)){notice='Enter whole-number rubric scores within 0–4, 0–3 and 0–3.';renderAssessment();return;}r.total=r.evidence+r.concern+r.practical;attempt.review=r;persist();archive();screen='results';flash='Instructor assessment saved.';renderAssessment(true);}
function startGrade(){if(!DEMO||attempt?.status!=='submitted')return;const r=attempt.review;gradeDraft=r?{evidence:String(r.evidence),concern:String(r.concern),practical:String(r.practical),feedback:r.feedback}:{evidence:'',concern:'',practical:'',feedback:''};screen='grade';flash='';renderAssessment(true);}
function confirmAction(title,body,label,fn){pendingAction=fn;let d=$('#assessment-confirm');if(!d){d=document.createElement('dialog');d.id='assessment-confirm';document.body.appendChild(d);}d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="options"><button id="assessment-cancel">Cancel</button><button class="primary" id="assessment-confirm-button">${esc(label)}</button></div>`;$('#assessment-cancel').onclick=()=>{pendingAction=null;d.close();};$('#assessment-confirm-button').onclick=()=>{const action=pendingAction;pendingAction=null;d.close();action?.();};d.showModal();}
function downloadFile(content,type,name){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exported(){return clone(attempt);}
function exportJSON(){if(!attempt)return;persist();downloadFile(JSON.stringify(exported(),null,2),'application/json',attempt.attemptId+'-r'+attempt.revision+(attempt.review?'-reviewed':'')+'.json');}
function reportHTML(){if(!attempt?.submission)return '';const g=attempt.submission.automatic,rev=attempt.review,profile=resultProfile();const title=`RECODE Session 09 · SPARK Events — ${attempt.studentName}`;
 return `<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>body{font:14px/1.5 Arial,sans-serif;color:#142e38;max-width:900px;margin:35px auto;padding:0 20px}h1{font-size:25px}h2{font-size:19px;border-bottom:2px solid #007d91;padding-bottom:6px;margin-top:25px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #dbe5e8;padding:8px;text-align:left}td:last-child,th:last-child{text-align:right}article{break-inside:avoid;border:1px solid #dbe5e8;border-radius:8px;padding:12px;margin:12px 0}article p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#526973}blockquote{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;padding:12px;background:#f1f6f6}.grade{font-size:19px;font-weight:bold}button{padding:10px 15px}@media print{body{margin:0;max-width:none}button{display:none}@page{margin:15mm}h2{break-after:avoid}}</style><h1>RECODE SESSION 09 · SPARK EVENTS<br>FINANCIAL INVESTIGATION RESULTS</h1><p><b>Student:</b> ${esc(attempt.studentName)}<br><b>Attempt:</b> ${esc(attempt.attemptId)} · revision ${attempt.revision}<br><b>Submitted:</b> ${esc(new Date(attempt.submission.submittedAt).toLocaleString('en-GB',{timeZone:'Asia/Beirut'}))} (Beirut)</p><table><thead><tr><th>Section</th><th>Result</th></tr></thead><tbody>${profile.names.map((n,i)=>`<tr><td>${n}</td><td>${i<g.scores.length?g.scores[i]+' / '+profile.max[i]:rev?rev.total+' / 10':'Pending instructor review'}</td></tr>`).join('')}<tr><td>Automatic score</td><td>${g.automatic} / 90</td></tr><tr><td>Instructor assessment</td><td>${rev?rev.total+' / 10':'Pending / 10'}</td></tr></tbody></table><p class="grade">${rev?'FINAL GRADE: '+(g.automatic+rev.total)+' / 100 · '+(g.automatic+rev.total)+'%':'Final score: Pending / 100'}</p>${g.rows.map((rs,i)=>`<h2>${i+1}. ${profile.names[i]} — ${g.scores[i]} / ${profile.max[i]}</h2>${rs.map(r=>`<article><b>${esc(r.question)}</b><p>Your original answer: ${esc(r.original)}</p><p>Correct answer: ${esc(r.correct)}</p><p>Explanation: ${esc(r.explanation)}</p>${r.written?`<p>Your explanation: ${esc(r.written)}</p>`:''}<p><b>Points: ${r.points} / ${r.max}</b></p></article>`).join('')}`).join('')}<h2>${profile.names.length}. Management recommendation</h2><blockquote>${esc(attempt.submission.answers.recommendation)}</blockquote><p>${rev?`Evidence: ${rev.evidence}/4 · realistic concern: ${rev.concern}/3 · practical recommendation: ${rev.practical}/3`:'Pending instructor review — evidence /4, concern /3, practical recommendation /3.'}</p><p>Instructor feedback: ${esc(rev?.feedback||'Pending / no feedback supplied.')}</p><h2>Performance summary</h2><table>${skillRows().map(([n,v])=>`<tr><td>${esc(n)}</td><td>${esc(v)}</td></tr>`).join('')}</table><p class="muted">Saved locally and transferred by file. This report is not centrally stored or cryptographically authenticated. April projector depreciation follows the supplied 36-month policy.</p><button onclick="window.print()">Print / Save as PDF</button></html>`;
}
function printReport(){if(!attempt?.submission)return;let frame=$('#assessment-print');if(frame)frame.remove();frame=document.createElement('iframe');frame.id='assessment-print';frame.title='Printable SPARK assessment report';frame.style.cssText='position:fixed;width:1px;height:1px;left:-10000px;border:0';frame.onload=()=>{frame.contentWindow.focus();frame.contentWindow.print();};frame.srcdoc=reportHTML();document.body.appendChild(frame);}
function validateStudentReturn(a){
 if(DEMO||attempt?.status!=='submitted')return;
 const action=a.instructorAction,same=a.attemptId===attempt.attemptId;
 if(a.status==='submitted'&&same&&a.revision===attempt.revision&&a.submission.problemRubric===attempt.submission.problemRubric&&a.submission.assessmentRubric===attempt.submission.assessmentRubric&&JSON.stringify(cleanAnswers(a.submission.answers,a.assessmentRubric))===JSON.stringify(cleanAnswers(attempt.submission.answers,attempt.assessmentRubric)))return;
 if(a.status==='draft'&&action?.previousAttemptId===attempt.attemptId&&action.previousRevision===attempt.revision&&((action.kind==='unlock'&&same&&a.revision===attempt.revision+1)||(action.kind==='reset'&&a.resetOf===attempt.attemptId)))return;
 throw Error('This attempt is locked. Import its matching reviewed submission or an instructor-issued unlock/reset file.');
}
function importDialog(){let f=$('#assessment-file');if(!f){f=document.createElement('input');f.id='assessment-file';f.type='file';f.accept='.json,application/json';f.hidden=true;document.body.appendChild(f);f.onchange=async()=>{try{const file=f.files[0];if(!file)return;if(file.size>1000000)throw Error('Choose a JSON file smaller than 1 MB.');const a=validateImport(JSON.parse(await file.text()));validateStudentReturn(a);confirmAction('Import this assessment?',`${a.studentName} · ${a.attemptId} · revision ${a.revision}. This replaces the SPARK copy on this browser. NOVA progress stays unchanged.`,'Import assessment',()=>applyImport(a));}catch(e){notice='Import failed: '+e.message;renderAssessment();}finally{f.value='';}};}f.click();}
function applyImport(a){archive();attempt=a;state.intro.active=false;state.stage=9;screen=a.status==='submitted'?'results':'records';flash='Assessment imported.';notice='';persist();renderAssessment(true);}
function instructorUnlock(){if(!DEMO||attempt?.status!=='submitted')return;confirmAction('Unlock this submitted attempt?','The current submission and review will be archived. A new revision opens for editing and must be submitted again.','Unlock attempt',()=>{archive();attempt.history.push({submission:clone(attempt.submission),review:clone(attempt.review)});attempt.history=attempt.history.slice(-20);attempt.instructorAction={kind:'unlock',previousAttemptId:attempt.attemptId,previousRevision:attempt.revision};if(attempt.submission.answers.audit)attempt.retiredAudit=clone(attempt.submission.answers.audit);attempt.answers=cleanAnswers(attempt.submission.answers,ASSESSMENT_RUBRIC);attempt.assessmentRubric=ASSESSMENT_RUBRIC;attempt.status='draft';attempt.problemRubric=PROBLEM_RUBRIC;attempt.workspace={mode:'groups',group:0};attempt.submission=null;attempt.review=null;attempt.revision++;attempt.page={section:0,index:0};screen='records';flash='Attempt unlocked. Export the draft JSON.';persist();renderAssessment(true);});}
function instructorReset(){if(!DEMO)return;confirmAction('Reset this assessment?','The current submission will be archived. A fresh attempt identifier will be created. Export it if the student needs to continue on another device.','Reset assessment',()=>{const old=attempt;archive();attempt=newAttempt(old?.studentName||'Student',old?.attemptId||null);attempt.instructorAction={kind:'reset',previousAttemptId:old?.attemptId||'',previousRevision:old?.revision||0};screen='records';flash='New attempt created.';persist();renderAssessment(true);});}
$('#card').addEventListener('input',e=>{if(state.stage<9)return;if(e.target.dataset.rubric){gradeDraft[e.target.dataset.rubric]=e.target.value;return;}takeInput(e);});
$('#card').addEventListener('change',e=>{if(state.stage<9)return;if(e.target.id==='detail-section'){detailSection=Number(e.target.value);detailIndex=0;renderAssessment();}if(e.target.id==='mistake-select'){mistakeIndex=Number(e.target.value);renderAssessment();$('#mistake-select').focus();}if(e.target.id==='classification')takeInput(e);if(e.target.id==='source-document'){sourceIndex=Number(e.target.value);$('#source-document-view').innerHTML=sourceDocument(sourceIndex);}if(e.target.id==='group-category'&&attempt?.status==='draft'){workspace().group=Number(e.target.value);flash='';persist();renderAssessment();$('#group-category').focus({preventScroll:true});}});
$('#card').addEventListener('click',e=>{if(state.stage<9)return;const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-assess-choice')){if(attempt?.status!=='draft')return;const k='problems',list=problems,id=list[attempt.page.index][0];(attempt.answers[k][id]??={}).choice=b.dataset.assessChoice==='true';flash='';persist();renderAssessment();$(`[data-assess-choice="${b.dataset.assessChoice}"]`)?.focus();return;}
 if(b.hasAttribute('data-open-document')){const i=Number(b.dataset.openDocument);if(i<records.length){attempt.page={section:0,index:i};screen='task';}else{sourceIndex=i;screen='document';}flash='';renderAssessment(true);return;}
 if(b.dataset.worksheetView&&attempt?.status==='draft'&&attempt.page.section===2){workspace().mode=b.dataset.worksheetView;flash='';persist();renderAssessment();$(`[data-worksheet-view="${b.dataset.worksheetView}"]`).focus({preventScroll:true});return;}
 const action=b.dataset.assessAction;if(action==='review-section'&&attempt.status==='draft'){const s=Number($('#review-section').value);attempt.page={section:s,index:0};screen='task';reviewMode=true;flash='';renderAssessment(true);}
 if(action==='return-review'){screen='ready';reviewMode=false;flash='';renderAssessment(true);}if(action==='library'){screen='records';renderAssessment(true);}if(action==='library-prev'&&libraryPage>0){libraryPage--;renderAssessment();}if(action==='library-next'&&libraryPage<4){libraryPage++;renderAssessment();}if(action==='next-section'){attempt.page={section:1,index:0};screen='task';renderAssessment(true);}
 if(action==='results'){screen='results';renderAssessment(true);}if(action==='all-feedback'){screen='details';detailSection=0;detailIndex=0;renderAssessment(true);}if(action==='export')exportJSON();if(action==='import')importDialog();if(action==='report')downloadFile(reportHTML(),'text/html',attempt.attemptId+'-report.html');if(action==='print')printReport();if(action==='grade')startGrade();if(action==='skills'){screen='skills';renderAssessment(true);}if(action==='detail-prev'&&detailIndex>0){detailIndex--;renderAssessment(true);}if(action==='detail-next'&&detailIndex<feedbackRows(detailSection).length-1){detailIndex++;renderAssessment(true);}
});
window.addEventListener('message',e=>{if(!DEMO||e.source!==parent||e.data?.scope!=='recode-instructor')return;const c=e.data;if(typeof c.action==='string'&&c.action.startsWith('spark-'))state.intro.active=false;
 if(c.action==='spark-open'){state.stage=9;screen=attempt?.status==='submitted'?'results':attempt?'task':'intro';renderAssessment(true);}
 if(c.action==='spark-import'){try{applyImport(validateImport(c.attempt));parent.postMessage({scope:'recode-instructor-reply',ok:true,message:'Imported '+attempt.studentName+' · '+attempt.attemptId},'*');}catch(err){parent.postMessage({scope:'recode-instructor-reply',ok:false,message:err.message},'*');}}
 if(c.action==='spark-grade'){state.stage=9;if(attempt?.status==='submitted')startGrade();else{screen=attempt?'task':'intro';notice='Import a submitted assessment before grading.';renderAssessment();}}
 if(c.action==='spark-export')exportJSON();if(c.action==='spark-report'&&attempt?.submission)downloadFile(reportHTML(),'text/html',attempt.attemptId+'-report.html');if(c.action==='spark-print')printReport();if(c.action==='spark-unlock'){state.stage=9;instructorUnlock();}if(c.action==='spark-reset'){state.stage=9;instructorReset();}
 if(c.action==='spark-details'&&attempt?.status==='submitted'){state.stage=9;screen='details';detailSection=0;detailIndex=0;renderAssessment(true);}
 if(c.action==='spark-status')parent.postMessage({scope:'recode-instructor-state',hasAttempt:!!attempt,status:attempt?.status||'none'},'*');
});
const exportHeader=document.createElement('button');exportHeader.id='assessment-export-header';exportHeader.className='quiet';exportHeader.textContent='Export JSON';exportHeader.hidden=true;exportHeader.onclick=exportJSON;$('.top-right').appendChild(exportHeader);
const importHeader=document.createElement('button');importHeader.id='assessment-import-header';importHeader.className='quiet';importHeader.textContent='Import JSON';importHeader.hidden=true;importHeader.onclick=importDialog;$('.top-right').appendChild(importHeader);
assessmentApp={render:renderAssessment,primary,back};
window.SparkAssessment={grade,parseAmount,recordGroups,validateImport,unanswered,reportHTML,exported,records,problems,statementFields,categories,sectionMax,getAttempt:()=>attempt};
if(state.stage>=9)renderAssessment();
})();

</script>
